armando_controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    #Controller per la modalità "trajectory" (Punto 4d)
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    #Controller per la modalità "position" (Punto 4c)
    simple_position_controller:
      type: forward_command_controller/ForwardCommandController

#Parametri per il controller di traiettoria
joint_trajectory_controller:
  ros__parameters:
    joints:
      - j0
      - j1
      - j2
      - j3
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: true
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

#Parametri per il controller di "position"
simple_position_controller:
  ros__parameters:
    joints:
      - j0
      - j1
      - j2
      - j3

    interface_name: position
    

    state_interfaces:
      - position
      - velocity
